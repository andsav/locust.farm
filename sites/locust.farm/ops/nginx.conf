server {
    listen 80;
    listen [::]:80;
    server_name locust.farm www.locust.farm;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name locust.farm www.locust.farm;
    ssl_certificate /etc/letsencrypt/live/locust.farm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locust.farm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/locust.farm/current;
    index index.html;
    auth_basic "Locust preview";
    auth_basic_user_file /etc/nginx/locust.farm.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/locust.farm.access.log;
    error_log /var/log/nginx/locust.farm.error.log;

    # Release downloads are public; the website remains an authenticated preview.
    location ^~ /downloads/ {
        auth_basic off;
        root /var/www/locust.farm;
        autoindex off;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
