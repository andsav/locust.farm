SPECIFICATION Spec
CONSTANTS
  Principals = {Worker, OtherWorker}
  Sessions = {SessionA, SessionB}
  Assignee = Worker
  A = SessionA
  B = SessionB
  None = NoValue
  Keys = {"k1", "k2"}
  MaxGeneration = 3
  MaxEvents = 3
  CheckGeneration = TRUE
  Scenario = "safety"
INVARIANTS
  TypeOK
  ClaimHolderBound
  GenerationsNeverDecrease
  NoCrossPrincipalEvents
  StaleWritesCannotAuthor
  OnlyCurrentAuthorizedWrites
  IdempotentRequestsAuthorOnce
  IdempotencyMatchesEvent
  UncertainCommitFencesSigning
  HealthyMemoryMatchesStore
