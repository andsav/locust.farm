[workspace]
members = [
    "crates/locust",
    "crates/locust-adapter",
    "crates/locust-core",
    "crates/locust-net",
    "crates/locust-proto",
    "crates/locust-store",
    "crates/locust-workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# One owner edits this table and Cargo.lock; see docs/workstreams.md.
[workspace.dependencies]
locust-adapter = { path = "crates/locust-adapter" }
locust-core = { path = "crates/locust-core" }
locust-net = { path = "crates/locust-net" }
locust-proto = { path = "crates/locust-proto" }
locust-store = { path = "crates/locust-store" }
locust-workspace = { path = "crates/locust-workspace" }

blake3 = "1.8"
chacha20poly1305 = "0.11"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
iroh = "1.3"
iroh-mainline-address-lookup = "0.6"
iroh-mdns-address-lookup = "0.6"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
semver = "1.0"
tempfile = "3"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml_edit = "0.25.15"
tracing = "0.1"

# Signing, verification, hashing and SQLite dominate test time; build them
# optimized even in development so every stream's tests stay fast.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
