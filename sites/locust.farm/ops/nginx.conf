server {
    listen 80;
    listen [::]:80;
    server_name locust.farm www.locust.farm;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name locust.farm www.locust.farm;
    ssl_certificate /etc/letsencrypt/live/locust.farm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locust.farm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/locust.farm/current;
    index index.html;
    auth_basic "Locust preview";
    auth_basic_user_file /etc/nginx/locust.farm.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/locust.farm.access.log;
    error_log /var/log/nginx/locust.farm.error.log;

    # Release downloads are public; the website remains an authenticated preview.
    location ^~ /downloads/ {
        auth_basic off;
        root /var/www/locust.farm;
        autoindex off;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Farm views are public, including the assets needed by a fresh browser.
    # SvelteKit emits a hash-based script CSP in each generated HTML page.
    location ^~ /_app/ {
        auth_basic off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /favicon.svg {
        auth_basic off;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /farm {
        auth_basic off;
        return 308 /farms;
    }
    location ^~ /farm/ {
        auth_basic off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files /farm.html =404;
    }
    location = /farms/ {
        auth_basic off;
        return 308 /farms;
    }
    location = /farms {
        auth_basic off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files /farms.html =404;
    }
    location /api/farms {
        auth_basic off;
        # The service enforces its advertised configurable body limit.
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        gzip off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
