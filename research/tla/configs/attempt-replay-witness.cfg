SPECIFICATION Spec
CONSTANTS
  Scenario = "replay"
  Principals = {WorkerIdentity,OtherIdentity}
  Sessions = {SessionA,SessionB}
  Attempts = {AttemptOne,AttemptTwo}
  Keys = {"k1","k2"}
  Worker = WorkerIdentity
  Other = OtherIdentity
  A = SessionA
  B = SessionB
  One = AttemptOne
  Two = AttemptTwo
  MaxGeneration = 3
  MaxEvents = 3
  CheckGeneration = TRUE
  None = NoValue
INVARIANTS
  TypeOK
  ClaimHolderBound
  GenerationsNeverDecrease
  NoCrossPrincipalEvents
  StaleWritesCannotAuthor
  OnlyAuthorizedWrites
  IdempotentRequestsAuthorOnce
  IdempotencyMatchesEvent
  UncertainCommitFencesSigning
  HealthyMemoryMatchesStore
  NeverWitness
