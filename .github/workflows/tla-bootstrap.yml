name: TLA bootstrap

on:
  workflow_dispatch:
  push:
    paths: ['research/tla/**', 'scripts/check_tla.py', 'scripts/tests/test_check_tla.py', '.github/workflows/tla-bootstrap.yml']
  pull_request:
    paths: ['research/tla/**', 'scripts/check_tla.py', 'scripts/tests/test_check_tla.py', '.github/workflows/tla-bootstrap.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    name: Pinned tools and runner fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner tests
        run: python3 -m unittest discover -s scripts/tests -p test_check_tla.py
      - name: Bootstrap and check fixtures
        run: python3 scripts/check_tla.py --bootstrap --suite fixtures
